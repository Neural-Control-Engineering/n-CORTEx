# N=2: Marc's example (README_marc.md), frequency axis widened to the real data's 2-249 Hz so FC2 (~63 Hz) is inside it.
N: 2
aperiodic:
  OFF:     {mu: 10.0, sd: 1.5}         # normal, linear space
  logD1:   {mu: log(2.0), sd: 0.3}     # d1 lognormal. EXP1 = d1 (implied mean EXP1 ~ 2)
  logD2:   {mu: log(12.0), sd: 0.4}    # d2 lognormal. EXP2 = d1 + d2 (implied mean EXP2 ~ 14, NOT 12)
  # logD3 omitted -> EXP3 = NaN
  logFC1:  {mu: log(7.0), sd: 0.3}     # FC1 lognormal
  logDFC2: {mu: log(56.0), sd: 0.5}    # FC2 - FC1 lognormal -> FC2 ~ 63 Hz, ordering by construction
  # logDFC3 omitted -> FC3 = Inf
peaks:
  count: {mu: 1.5, sd: 0.8, min: 0, max: 4}
  CF:    {mu: 20.0, sd: 10.0}
  logPW: {mu: 0.5, sd: 1.5}
  BW:    {mu: 3.0, sd: 1.5}
noise:
  model: chi2
  df: 8
frequency_axis:
  f_start: 0
  f_end: 249
  n_points: 250
